[package]
name = "key-reset-follow"
version = "0.2.3"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "bd69329a37264eb28967e07bd1d5622472af747c", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }

[[example]]
name = "fault-proxy"
path = "tests/support/fault_proxy.rs"
